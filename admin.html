<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - TechFix Müzik</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #0f0f14;
            --bg-secondary: #1a1a24;
            --bg-card: #22222e;
            --bg-hover: #2a2a3a;
            --text-primary: #f0f0f5;
            --text-secondary: #a0a0b0;
            --text-muted: #6a6a7a;
            --accent-primary: #7c3aed;
            --accent-secondary: #a855f7;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #a855f7);
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border-color: #2a2a3a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--accent-gradient);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .logo-text { font-size: 1.25rem; font-weight: 600; }
        .logo-text span { color: var(--accent-secondary); }

        .header-actions { display: flex; align-items: center; gap: 1rem; }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 9999px;
            font-size: 0.875rem;
            color: var(--success);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: white;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }

        .main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 1200px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }

        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.25rem;
            transition: all 0.3s ease;
        }

        .kpi-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.1);
        }

        .kpi-icon {
            width: 40px;
            height: 40px;
            background: rgba(124, 58, 237, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            margin-bottom: 0.75rem;
        }

        .kpi-value {
            font-size: 1.75rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .kpi-label {
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-top: 0.25rem;
        }

        /* Charts Grid */
        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 1024px) { .charts-grid { grid-template-columns: 1fr; } }

        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
        }

        .chart-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .chart-container {
            position: relative;
            height: 280px;
        }

        /* Logs Section */
        .logs-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 1.125rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        table { width: 100%; border-collapse: collapse; }
        thead { background: var(--bg-secondary); }

        th {
            padding: 1rem 1.5rem;
            text-align: left;
            font-weight: 500;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.875rem;
        }

        tr:hover { background: var(--bg-hover); }
        tr:last-child td { border-bottom: none; }

        .text-truncate {
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sentiment-badge {
            display: inline-flex;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .sentiment-positive, .sentiment-olumlu {
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
        }

        .sentiment-negative, .sentiment-olumsuz {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .sentiment-neutral, .sentiment-belirsiz {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            gap: 0.5rem;
            color: var(--text-muted);
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">🎵</div>
                <div class="logo-text">TechFix <span>Admin</span></div>
            </div>
            <div class="header-actions">
                <div class="status-badge">
                    <span class="status-dot"></span>
                    Sistem Aktif
                </div>
                <button class="btn btn-ghost" onclick="refreshData()">🔄 Yenile</button>
                <a href="/" class="btn btn-primary">🏠 Ana Sayfa</a>
            </div>
        </div>
    </header>

    <main class="main">
        <!-- KPI Cards -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-icon">📞</div>
                <div class="kpi-value" id="kpi-total">-</div>
                <div class="kpi-label">Toplam Çağrı</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon">⚡</div>
                <div class="kpi-value" id="kpi-recent">-</div>
                <div class="kpi-label">Son 24 Saat</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon">⏱️</div>
                <div class="kpi-value" id="kpi-duration">-</div>
                <div class="kpi-label">Ort. Süre (sn)</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon">🎯</div>
                <div class="kpi-value" id="kpi-intent">-</div>
                <div class="kpi-label">Intent Doğruluğu</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon">⚠️</div>
                <div class="kpi-value" id="kpi-error">-</div>
                <div class="kpi-label">Hata Oranı</div>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-title">📈 Çağrı Hacmi (Son 7 Gün)</div>
                <div class="chart-container">
                    <canvas id="callVolumeChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <div class="chart-title">🎯 Intent Dağılımı</div>
                <div class="chart-container">
                    <canvas id="intentChart"></canvas>
                </div>
            </div>
        </div>

        <div class="charts-grid" style="grid-template-columns: 1fr;">
            <div class="chart-card">
                <div class="chart-title">🎵 En Çok Aranan</div>
                <div class="chart-container">
                    <canvas id="topSearchChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Logs Table -->
        <div class="logs-section">
            <div class="section-header">
                <h2 class="section-title">📋 Son Görüşmeler</h2>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tarih</th>
                            <th>Müşteri</th>
                            <th>AI Yanıtı</th>
                            <th>Duygu</th>
                        </tr>
                    </thead>
                    <tbody id="logs-body">
                        <tr><td colspan="5" class="loading"><div class="spinner"></div>Yükleniyor...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let callVolumeChart, intentChart, topSearchChart;

        async function loadAnalytics() {
            try {
                const [statsRes, analyticsRes] = await Promise.all([
                    fetch('/api/admin/stats'),
                    fetch('/api/admin/analytics')
                ]);
                
                const stats = await statsRes.json();
                const analytics = await analyticsRes.json();

                // KPI Cards
                document.getElementById('kpi-total').textContent = stats.total_calls || 0;
                document.getElementById('kpi-recent').textContent = stats.recent_calls_24h || 0;
                document.getElementById('kpi-duration').textContent = analytics.stats?.avg_duration || 0;
                document.getElementById('kpi-intent').textContent = (analytics.stats?.intent_accuracy || 0) + '%';
                document.getElementById('kpi-error').textContent = (analytics.stats?.error_rate || 0) + '%';

                // Call Volume Chart
                renderCallVolumeChart(analytics.call_volume || []);
                
                // Intent Distribution Chart
                renderIntentChart(analytics.intent_distribution || {});
                
                // Top Searched Chart
                renderTopSearchChart(analytics.top_searched_terms || []);

            } catch (err) {
                console.error('Analytics load error:', err);
            }
        }

        function renderCallVolumeChart(data) {
            const ctx = document.getElementById('callVolumeChart').getContext('2d');
            
            if (callVolumeChart) callVolumeChart.destroy();
            
            callVolumeChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.date),
                    datasets: [{
                        label: 'Çağrı Sayısı',
                        data: data.map(d => d.count),
                        borderColor: '#7c3aed',
                        backgroundColor: 'rgba(124, 58, 237, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#2a2a3a' }, ticks: { color: '#6a6a7a' } },
                        y: { grid: { color: '#2a2a3a' }, ticks: { color: '#6a6a7a' } }
                    }
                }
            });
        }

        function renderIntentChart(data) {
            const ctx = document.getElementById('intentChart').getContext('2d');
            
            if (intentChart) intentChart.destroy();
            
            const labels = Object.keys(data);
            const values = Object.values(data);
            const colors = ['#7c3aed', '#22c55e', '#f59e0b', '#ef4444', '#3b82f6'];

            intentChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: colors.slice(0, labels.length)
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { 
                            position: 'right',
                            labels: { color: '#a0a0b0' }
                        }
                    }
                }
            });
        }

        function renderTopSearchChart(data) {
            const ctx = document.getElementById('topSearchChart').getContext('2d');
            
            if (topSearchChart) topSearchChart.destroy();

            topSearchChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => d.term?.substring(0, 30) || 'N/A'),
                    datasets: [{
                        label: 'Arama Sayısı',
                        data: data.map(d => d.count),
                        backgroundColor: '#a855f7',
                        borderRadius: 6
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#2a2a3a' }, ticks: { color: '#6a6a7a' } },
                        y: { grid: { display: false }, ticks: { color: '#a0a0b0' } }
                    }
                }
            });
        }

        async function loadLogs() {
            const tbody = document.getElementById('logs-body');
            try {
                const res = await fetch('/api/admin/logs?limit=20');
                const data = await res.json();
                
                if (!data.logs?.length) {
                    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Kayıt yok</td></tr>';
                    return;
                }
                
                tbody.innerHTML = data.logs.map(log => `
                    <tr>
                        <td><strong>#${log.id}</strong></td>
                        <td>${formatDate(log.timestamp)}</td>
                        <td class="text-truncate">${escapeHtml(log.customer_text || '-')}</td>
                        <td class="text-truncate">${escapeHtml(log.ai_response || '-')}</td>
                        <td><span class="sentiment-badge sentiment-${(log.sentiment || 'neutral').toLowerCase()}">${log.sentiment || 'N/A'}</span></td>
                    </tr>
                `).join('');
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Hata</td></tr>';
            }
        }

        function formatDate(iso) {
            if (!iso) return '-';
            const d = new Date(iso);
            return d.toLocaleDateString('tr-TR') + ' ' + d.toLocaleTimeString('tr-TR', {hour: '2-digit', minute: '2-digit'});
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function refreshData() {
            loadAnalytics();
            loadLogs();
        }

        document.addEventListener('DOMContentLoaded', () => {
            refreshData();
            setInterval(refreshData, 30000);
        });
    </script>
</body>
</html>
